  b.className = fit ? 'p-4 sm:p-6 flex flex-col relative' : 'p-6 relative';
  b.style.maxHeight = fit ? 'calc(100dvh - 1rem)' : '';
  d.style.maxHeight = 'calc(100dvh - 1rem)'; d.style.overflow = fit ? 'hidden' : 'auto';
  if (!d.open) d.showModal();

function splitCsv(line) {

async function importSkus(file) {
  if (!file) return;
  const { data: sup, error } = await sb.from('parties').select('id,name').contains('roles', ['supplier']);
  if (error) return toast(error.message);
  const map = new Map(sup.map((s) => [s.name.trim().toLowerCase(), s.id]));
  const lines = (await file.text()).split(/\r?\n/).filter((l) => l.trim());
  const head = splitCsv(lines[0] || '').map((h) => h.toLowerCase().replace(/[^a-z]/g, ''));
  const ix = (keys) => head.findIndex((h) => keys.includes(h));
  const iS = ix(['sku', 'partnumber', 'item']), iD = ix(['description', 'desc']), iP = ix(['supplier', 'vendor', 'manufacturer']), iN = ix(['supplierpartnumber', 'supplierpn', 'mpn']);
  if (iS < 0 || iP < 0) return toast('The CSV needs "sku" (product) and "supplier" columns.');
  const rows = [], bad = new Set();
  for (const l of lines.slice(1)) {
    const c = splitCsv(l), sku = (c[iS] || '').trim(); if (!sku) continue;
    const sid = map.get((c[iP] || '').trim().toLowerCase());
    if (!sid) { bad.add(c[iP] || '(blank)'); continue; }
    rows.push({ sku, description: iD >= 0 ? c[iD] || null : null, supplier_id: sid, supplier_part_number: iN >= 0 ? c[iN] || null : null });
  }
  let done = 0;
  for (let i = 0; i < rows.length; i += 100) {
    const r = await sb.from('skus').upsert(rows.slice(i, i + 100), { onConflict: 'sku' });
    if (r.error) return modal(`<p class="text-red-600 text-sm">${esc(r.error.message)}</p><p class="text-sm mt-2">${done} products (SKUs) were saved before the error.</p><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
    done += Math.min(100, rows.length - i);
  }
  if (bad.size) modal(`<h3 class="text-lg font-semibold">${done} products (SKUs) saved</h3><p class="text-sm text-slate-600 mt-2">These supplier names did not match a supplier exactly, so their rows were skipped. Add the supplier or fix the spelling and import again:</p><ul class="mt-2 text-sm list-disc pl-5">${[...bad].map((b) => `<li>${esc(b)}</li>`).join('')}</ul><div class="mt-4 text-right">${btn('OK', 'close')}</div>`);
  else toast(`${done} products (SKUs) saved`);
  renderSkus();
}

function parseCsvText(t) {
  t = t.replace(/^﻿/, ''); const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); out.push(row); }
  return out.filter((r) => r.some((c) => String(c).trim() !== ''));
}

const CSL_LIST = (s) => {

let recF = { q: '', type: '', order: '', keep: '', sort: 'date', dir: -1 };
async function tradeRecords() {
  const { data, error } = await sb.from('documents').select('id,title,doc_type,issued_on,retain_until,file_name,storage_path,transaction_id,transaction:transactions(reference),type:document_types(name)').in('doc_type', CUSTOMS_TYPES).order('created_at', { ascending: false }).limit(2000);
  if (error) throw error;
  const oids = [...new Set(data.filter((d) => d.transaction_id).map((d) => d.transaction_id))], keep = new Map();
  if (oids.length) { const r = await sb.from('v_order_retention').select('transaction_id,keep_until').in('transaction_id', oids); (r.data || []).forEach((x) => keep.set(x.transaction_id, x.keep_until)); }
  const until = (d) => { const k = keep.get(d.transaction_id); return k && (!d.retain_until || k > d.retain_until) ? k : d.retain_until; };
  const f = recF, today = todayIso(), soon = new Date(Date.now() + 90 * 864e5).toISOString().slice(0, 10);
  const tName = (d) => d.type?.name || d.doc_type, oRef = (d) => d.transaction?.reference || '';
  const types = [...new Map(data.map((d) => [d.doc_type, tName(d)])).entries()].sort((x, y) => x[1].localeCompare(y[1]));
  const orders = [...new Set(data.map(oRef).filter(Boolean))].sort();
  const key = { title: (d) => (d.title || '').toLowerCase(), type: (d) => tName(d).toLowerCase(), order: (d) => oRef(d).toLowerCase(), date: (d) => d.issued_on || '', keep: (d) => until(d) || '' }[f.sort] || ((d) => d.issued_on || '');
  const vis = data.filter((d) => (!f.type || d.doc_type === f.type) && (!f.order || (f.order === '__none' ? !d.transaction_id : oRef(d) === f.order)) && (!f.q || [d.title, d.file_name, tName(d), oRef(d)].join(' ').toLowerCase().includes(f.q.toLowerCase())) && (!f.keep || (f.keep === 'expired' ? until(d) && until(d) < today : f.keep === 'soon' ? until(d) && until(d) >= today && until(d) <= soon : !until(d) || until(d) > soon)))
    .sort((x, y) => { const kx = key(x), ky = key(y); return (kx < ky ? -1 : kx > ky ? 1 : 0) * f.dir; });
  const sel = (id, opts, cur) => `<select id="${id}" class="rounded-lg border border-slate-300 p-2 text-sm">${opts.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const th = (k, l) => `<th class="p-3"><button type="button" data-a="recSort" data-k="${k}" class="inline-flex items-center gap-1 font-medium hover:text-slate-900">${l}<span class="text-xs ${f.sort === k ? 'text-slate-900' : 'text-slate-300'}">${f.sort === k ? (f.dir > 0 ? '&#9650;' : '&#9660;') : '&#9660;'}</span></button></th>`;

async function collectFindings(declId) {
  const [dRes, sm, ref] = await Promise.all([
    sb.from('cmrt_declarations').select('id,party_id,reporting_year,is_complete,completeness_notes,party:parties(name)').eq('id', declId).single(),
    fetchAll((a, b) => sb.from('cmrt_smelters').select('metal,smelter_name,smelter_country,smelter_id,check_status,disposition').eq('declaration_id', declId).order('id').range(a, b)),
    fetchAll((a, b) => sb.from('v_rmap_current').select('cid,metal').order('id').range(a, b))]);
  if (dRes.error) throw dRes.error;
  const key = (m, c) => String(m || '').toLowerCase() + '|' + String(c || '').trim().toUpperCase();
  const refKeys = new Set(ref.map((r) => key(r.metal, r.cid))), declKeys = new Set(sm.filter((x) => x.smelter_id).map((x) => key(x.metal, x.smelter_id)));
  const matched = [...declKeys].filter((k) => refKeys.has(k)).length;
  return { d: dRes.data, issues: sm.filter(isOpenFlag), pct: refKeys.size ? Math.round((100 * matched) / refKeys.size) : 0 };
}
function buildExceptions(f) {
  const cap = (m) => (m ? m[0].toUpperCase() + m.slice(1) : ''), out = [], used = new Set();
  const take = (fn) => f.issues.filter((x, i) => !used.has(i) && fn(x) && (used.add(i), true));
  const ni = take((x) => !x.smelter_id && /not yet identified/i.test(x.smelter_name || ''));
  if (ni.length) out.push(`Unidentified smelters for ${[...new Set(ni.map((x) => cap(x.metal)))].join(', ')}. Identify them and give their RMI smelter IDs, or give a dated plan to do so. If any smelter is still unidentified, the answer to the question on whether all smelters are identified should be No.`);
  const nl = take((x) => !x.smelter_id && /not listed/i.test(x.smelter_name || ''));
  if (nl.length) out.push(`Entries marked "Smelter not listed" with no usable name (${nl.map((x) => cap(x.metal) + (x.smelter_country ? ', ' + x.smelter_country : '')).join('; ')}). Give each smelter's full legal name, country and address.`);
  take((x) => !x.smelter_id).forEach((x) => out.push(`${x.smelter_name || 'Unnamed smelter'} (${cap(x.metal)}) has no smelter ID. Give the RMI smelter ID, or the full name, country and address if it has none.`));
  take((x) => x.check_status === 'not_listed').forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id}) is not on the current RMI smelter list. Confirm the ID is correct and whether you still source from this smelter.`));
  take((x) => x.check_status === 'non_conformant').forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id}) is not conformant under RMAP. Confirm whether you still use it and your plan to stop or have it audited.`));
  take(() => true).forEach((x) => out.push(`${x.smelter_name || 'Smelter'} (${cap(x.metal)}, ${x.smelter_id || 'no ID'}) has an unrecognised status. Confirm its current status.`));
  if (f.pct >= 80) out.push(`The smelter list covers about ${f.pct}% of the RMI reference list. List only the smelters actually in your supply chain for the products declared.`);
  if (!f.d.is_complete) out.push(`Some declaration fields could not be read (${(f.d.completeness_notes || '').replace(/^Could not find: /, '').replace(/\. Please verify.*$/, '') || 'see the form'}). Make sure all mandatory fields are filled in.`);
  return out;
}

function loginScreen(msg = '') {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><form id="lf" class="w-full max-w-sm rounded-2xl bg-white border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight">Conformality - Compliance Ledger</h1><p class="text-sm text-slate-500 mt-1">Sign in with your work account.</p>
    <input id="em" type="email" required autocomplete="username" placeholder="Email" class="mt-6 w-full rounded-lg border border-slate-300 p-2.5">
    <input id="pw" type="password" required autocomplete="current-password" placeholder="Password" class="mt-3 w-full rounded-lg border border-slate-300 p-2.5">
    <p class="text-sm text-red-600 mt-2 min-h-[1.25rem]">${esc(msg)}</p>
    <button class="mt-2 w-full rounded-lg bg-slate-900 text-white py-2.5 font-medium hover:bg-slate-700">Sign in</button>
    <button type="button" id="fpw" class="mt-4 w-full text-sm text-slate-500 hover:text-slate-900 underline">Forgot your password?</button></form></div>`;
  $('#fpw').onclick = () => resetScreen('email', $('#em').value);
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
    if (error) loginScreen(error.message);

// Password reset by one-time code (no link to click, so mail filters that rewrite or block links do not break it):
// 1) email the code, 2) verifyOtp with the code (this signs the person in), 3) updateUser sets the new password.
let resetting = false;
function resetScreen(step, email = '', msg = '', note = '') {
  resetting = true;
  const head = { email: ['Reset your password', 'Enter your work email and we will send you a one-time code.'], code: ['Enter your code', `We sent a code to ${esc(email)}. It is valid for a short time and works once.`], pw: ['Choose a new password', 'Pick a new password for your account.'] }[step];
  const fields = { email: `<input id="rem" type="email" required autocomplete="username" value="${esc(email)}" placeholder="Email" class="mt-5 w-full rounded-lg border border-slate-300 p-2.5">`,
    code: `<input id="rcode" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" placeholder="Code from the email" class="mt-5 w-full rounded-lg border border-slate-300 p-2.5 tracking-widest text-center text-lg">`,
    pw: `<input id="rpw" type="password" required autocomplete="new-password" placeholder="New password" class="mt-5 w-full rounded-lg border border-slate-300 p-2.5"><input id="rpw2" type="password" required autocomplete="new-password" placeholder="Repeat new password" class="mt-3 w-full rounded-lg border border-slate-300 p-2.5">` }[step];
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><form id="rf" class="w-full max-w-sm rounded-2xl bg-white border border-slate-200 shadow-sm p-8">
    <h1 class="text-2xl font-semibold tracking-tight">${head[0]}</h1><p class="text-sm text-slate-500 mt-1">${head[1]}</p>${note ? `<p class="text-sm text-emerald-700 mt-2">${esc(note)}</p>` : ''}${fields}
    <p id="rerr" class="text-sm text-red-600 mt-2 min-h-[1.25rem]">${esc(msg)}</p>
    <button class="mt-2 w-full rounded-lg bg-slate-900 text-white py-2.5 font-medium hover:bg-slate-700">${{ email: 'Send code', code: 'Verify code', pw: 'Save password' }[step]}</button>
    ${step === 'pw' ? '' : '<button type="button" id="rback" class="mt-4 w-full text-sm text-slate-500 hover:text-slate-900 underline">Back to sign in</button>'}</form></div>`;
  if ($('#rback')) $('#rback').onclick = () => { resetting = false; loginScreen(); };
  $('#rf').onsubmit = async (e) => {
    e.preventDefault();
    if (step === 'email') {
      const em = $('#rem').value.trim();
      const { error } = await sb.auth.resetPasswordForEmail(em);
      return error ? resetScreen('email', em, error.message) : resetScreen('code', em, '', 'If that email has an account, a code is on its way.');
    }
    if (step === 'code') {
      const { error } = await sb.auth.verifyOtp({ email, token: $('#rcode').value.trim(), type: 'recovery' });
      return error ? resetScreen('code', email, error.message.includes('expired') || error.message.includes('invalid') ? 'That code is wrong or has expired. Go back and ask for a new one.' : error.message) : resetScreen('pw', email);
    }
    const a = $('#rpw').value;
    if (a !== $('#rpw2').value) return ($('#rerr').textContent = 'The two passwords do not match.');
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return ($('#rerr').textContent = error.message);
    resetting = false;
    const { data } = await sb.auth.getSession();
    afterAuth(data.session);
  };
}

async function afterAuth(session) {
  if (resetting) return;
  if (!session) return loginScreen();
  user = session.user;
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-red-200 p-8"><h1 class="text-lg font-semibold text-red-700">Could not load your profile</h1><p class="text-sm text-slate-600 mt-2">${esc(error.message)}</p><p class="text-xs text-slate-400 mt-2">Signed in as ${esc(user.email)}</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  profile = data;
  if (!profile || !profile.active) {
    $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-sm text-center"><h1 class="text-xl font-semibold">Waiting for approval</h1><p class="text-slate-500 mt-2">Your account exists but an admin has not activated it yet.</p><div class="mt-4">${btn('Sign out', 'signout', {}, 'ghost')}</div></div></div>`;
    return;
  }
  await loadFeatures();
  route();
}

if (!CFG.url || !CFG.key) {
  $('#app').innerHTML = `<div class="min-h-screen grid place-items-center p-4"><div class="max-w-md rounded-2xl bg-white border border-slate-200 p-8"><h1 class="text-lg font-semibold">Almost there</h1><p class="text-sm text-slate-600 mt-2">Open this file and paste your Supabase URL and anon key into the <code>CFG</code> block at the top of the script.</p></div></div>`;
} else {
  sb = supabase.createClient(CFG.url, CFG.key, { db: { schema: 'compliance' } });
  sb.auth.onAuthStateChange((_e, session) => setTimeout(() => afterAuth(session), 0));
}
</script>
</body>
</html>
